[project]
name = "hospital-twin"
version = "0.1.0"
description = "Hospital Twin backend: simulation, API, ML, agent and governance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "simpy>=4.1",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["twin"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point; DSNs are local dummies; seeded rngs are fine; combined asserts and zip() over
# neighbours are readable in tests.
"tests/**" = ["S101", "S105", "S106", "S311", "PT018", "RUF007"]
# The simulation needs seeded, reproducible randomness, not cryptographic randomness.
"twin/sim/**" = ["S311"]
# The model card and the training report are prose; wrapping them would make them harder to edit.
"twin/ml/card.py" = ["E501"]
"twin/ml/cli.py" = ["E501"]

[[tool.mypy.overrides]]
# These libraries ship no type information. Calls into them are wrapped in typed helpers in twin/ml.
module = ["lightgbm.*", "shap.*", "sklearn.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["twin", "tests"]

name: CI

on:
  push:
    branches: [main]
    tags: ['cp*', 'x*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Install browser system libraries
        run: cd frontend && npx playwright install-deps chromium

      - name: make verify
        run: make verify

      - name: make e2e
        run: make e2e

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            docs/evidence/
          if-no-files-found: ignore

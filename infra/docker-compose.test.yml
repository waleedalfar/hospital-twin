# Database for integration tests (CLAUDE.md §3). Data lives in memory, so every start is a clean server.
# Each test creates and drops its own database inside it.
name: hospital-twin-test
services:
  db-test:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin_test"]
      interval: 2s
      timeout: 3s
      retries: 30

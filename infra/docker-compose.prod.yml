# Production: backend container plus Caddy (HTTPS). The database is Tiger Cloud, reached through DATABASE_URL
# in the .env file next to this stack (PROMPT.md §12). Run from the repo root on the VM:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
name: hospital-twin-prod
services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file: ../.env
    environment:
      API_HOST: 0.0.0.0
    volumes:
      # Training rows for the federated run button (copied there by `make deploy`).
      - ../data/ml:/app/data/ml
    restart: unless-stopped
    expose:
      - "8000"
  # Optional local model for the agent when Gemini fails or hangs (no key, no quota). Turn it on with
  # COMPOSE_PROFILES=ollama plus OLLAMA_URL=http://ollama:11434 and OLLAMA_MODEL in .env, then pull the model once:
  #   docker compose -f infra/docker-compose.prod.yml --env-file .env exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    expose:
      - "11434"
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  ollama-data:
  caddy-data:
  caddy-config:
